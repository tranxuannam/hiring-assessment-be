[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiring-assessment-be"
version = "0.1.0"
description = "FastAPI backend foundation for the hiring assessment system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "email-validator>=2.2,<3.0",
    "openai>=1.50,<2.0",
    "python-multipart>=0.0.17,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
